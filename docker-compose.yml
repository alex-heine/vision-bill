services:
  vision_bill:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PG__HOST: db
      PG__PORT: "5432"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/vision_bill:/app/src/vision_bill
      - ./server_data/logs:/app/logs
      - ./server_data/uploads:/app/uploads
      - ./server_data/config:/app/config
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn src.vision_bill.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/src/vision_bill

  db:
    image: postgres:18
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
