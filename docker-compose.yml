services:
  vision_bill:
    build: .
    container_name: vision_bill
    restart: always
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    volumes:
      - ./src/vision_bill:/app/src/vision_bill
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    command: >
      uv run uvicorn src.vision_bill.main:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/src/vision_bill

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
