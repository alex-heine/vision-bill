services:
  vision_bill:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PG__HOST: db
      PG__PORT: "5432"
    ports:
      - "${API__PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres_net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/vision_bill:/app/src/vision_bill
      - ./server_data/logs:/app/logs
      - ./server_data/uploads:/app/uploads
      - ./server_data/config:/app/config
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn src.vision_bill.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/src/vision_bill

  db:
    image: postgres:18
    container_name: postgres
    pull_policy: always # re-pull latest 18.x tag whenever `docker compose up` runs
    restart: unless-stopped # auto-start on host/Docker reboot
    environment:
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - postgres_net
    # No `ports:` section on purpose - nothing is published to the NAS host.
    # Other containers reach this one only via the internal `postgres_net`
    # network, at hostname "postgres", port 5432.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - wal_compression=on
      - -c
      - log_connections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG__USER} -d ${PG__DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:

networks:
  postgres_net:
    name: postgres_net
    driver: bridge
