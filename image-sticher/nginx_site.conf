server {
    listen 80;

    # Error handling for unmatched paths
    error_page 403 /403.html;
    location = /403.html {
        root /usr/share/nginx/custom_html; # Assuming a placeholder error page exists or will work
        internal;
    }

    # Only process requests matching this exact path and serve it from the mounted volume root
    location / {
        root /usr/share/nginx/custom_html;
        index image-stitcher.html;
    }
}
