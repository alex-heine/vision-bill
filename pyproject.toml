[project]
name = "vision-bill"
version = "0.0.1"
description = "Invoice tracking API with LLM capabilities"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pydantic-settings>=2.14.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "stream-zip>=0.0.84",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
