# vision-bill e2e test stack.
#
# Self-contained: builds the real app image, boots Postgres and a
# deterministic OpenAI-compatible LLM stub. Fresh database per run:
#   make e2e-up     # build + start
#   make e2e-down   # stop + delete the database volume
#
# Fixed host ports (fail loudly if taken):
#   app  53625   (matches the Playwright default base URL)
#   pg   5433
#   stub 9123
services:
  pg:
    image: postgres:18
    pull_policy: always
    environment:
      POSTGRES_DB: vision_bill
      POSTGRES_USER: vision_bill
      POSTGRES_PASSWORD: vision_bill
      # postgres:18 entrypoint expects the data dir under /var/lib/postgresql
      # (matches the main docker-compose.yml db service).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_bill -d vision_bill"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data

  llm-stub:
    image: python:3.12-slim
    working_dir: /stub
    command: ["python", "server.py"]
    volumes:
      - ./e2e/llm_stub:/stub:ro
      - ./tests/e2e/data:/data:ro
    ports:
      - "9123:9123"

  app:
    build: .
    depends_on:
      pg:
        condition: service_healthy
      llm-stub:
        condition: service_started
    environment:
      AUTH__SECRET_KEY: e2e-secret-do-not-use
      AUTH__BOOTSTRAP_USERNAME: admin
      AUTH__BOOTSTRAP_PASSWORD: admin-e2e-pass
      AUTH__ALLOW_REGISTRATION: "true"
      AUTH__ADMIN_CAN_SEE_ALL: "true"
      LLM__PROVIDER: openai
      LLM__HOST: http://llm-stub:9123/v1
      LLM__API_KEY: e2e-test-key
      LLM__MODEL_NAME: e2e-vision
      PG__HOST: pg
      PG__PORT: "5432"
      PG__DB: vision_bill
      PG__USER: vision_bill
      PG__PASSWORD: vision_bill
      IMAGES__SAVE_DIR: /app/uploads
      IMAGES__TMP_DIR: /app/uploads_tmp
    volumes:
      - e2e_uploads:/app/uploads
      - e2e_uploads_tmp:/app/uploads_tmp
      # Pre-seeded config (llm.temperature); see e2e/config/config.yaml.
      - ./e2e/config:/app/config
    ports:
      - "53625:8080"

volumes:
  e2e_pgdata:
  e2e_uploads:
  e2e_uploads_tmp:
