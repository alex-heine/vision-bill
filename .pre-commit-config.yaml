# Pre-commit hooks for vision-bill.
#
# Install pre-commit itself on the host with:
#   pipx install pre-commit
#
# All hooks are local and run inside the project's uv-managed environment,
# so `uv` must be on PATH (see `make install-uv`) and the environment must
# be synced (see `make setup`).
repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint (ruff + mypy)
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: Tests (pytest)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
